<main class="trove-page">
  <section class="trove-stage" aria-label="Starfold City game">
    <iframe
      #gameFrame
      title="Starfold City"
      src="/assets/starfold-city.html"
      allow="fullscreen; autoplay"
      scrolling="no"
    ></iframe>
  </section>

  <nav class="trove-hud" aria-label="Trove controls">
    <a routerLink="/" class="trove-control" aria-label="Back to LivingWiki home">
      <span class="material-symbols-outlined">arrow_back</span>
    </a>
    <button
      type="button"
      class="trove-control"
      [attr.aria-label]="isFullscreen() ? 'Exit fullscreen' : 'Play fullscreen'"
      (click)="toggleFullscreen()"
    >
      <span class="material-symbols-outlined">{{ isFullscreen() ? 'fullscreen_exit' : 'fullscreen' }}</span>
    </button>
    <a routerLink="/boards" class="trove-control" aria-label="Open boards">
      <span class="material-symbols-outlined">dashboard_customize</span>
    </a>
  </nav>
</main>
