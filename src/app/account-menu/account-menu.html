@if (isSignedIn()) {
  <div class="avatar-menu-wrapper relative">
    <button
      type="button"
      class="flex h-9 w-9 items-center justify-center rounded-full border border-[var(--line)] bg-[var(--soft-fill)] text-xs font-black text-[var(--accent)] shadow-[0_10px_24px_-20px_rgba(59,175,98,0.9)] transition-all duration-200 hover:-translate-y-0.5 hover:border-[var(--accent)]/35 hover:bg-[var(--soft-fill-strong)] focus:outline-none focus:ring-2 focus:ring-[var(--accent)]/20"
      [attr.aria-expanded]="menuOpen()"
      aria-haspopup="menu"
      aria-label="Account menu"
      (click)="toggleMenu()"
    >
      {{ userInitials() }}
    </button>

    @if (menuOpen()) {
      <div
        class="absolute right-0 top-full z-50 mt-2 w-72 origin-top-right overflow-hidden rounded-2xl border border-[var(--line)] bg-[var(--surface)] shadow-[var(--shadow-elevated)] backdrop-blur-xl animate-fade-up"
        style="animation-duration: 0.15s"
        role="menu"
      >
        <div class="border-b border-[var(--line)] px-4 py-4">
          <div class="flex items-center gap-3">
            <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-[var(--line)] bg-[var(--soft-fill)] text-sm font-black text-[var(--accent)]">
              {{ userInitials() }}
            </span>
            <span class="min-w-0">
              <span class="block truncate text-sm font-black text-[var(--text)]">{{ userName() }}</span>
              <span class="mt-0.5 block truncate text-xs text-[var(--muted)]">{{ userEmail() }}</span>
            </span>
          </div>
          @if (isAdmin()) {
            <span class="mt-3 inline-flex rounded-full border border-[var(--accent)]/30 bg-[var(--soft-fill)] px-2 py-0.5 text-[10px] font-black uppercase tracking-[0.14em] text-[var(--accent)]">
              Admin
            </span>
          }
        </div>

        <div class="py-1.5">
          <a
            routerLink="/wikis"
            role="menuitem"
            class="flex w-full items-center gap-3 px-4 py-2.5 text-sm font-semibold text-[var(--muted)] transition-colors duration-150 hover:bg-[var(--soft-fill)] hover:text-[var(--text)]"
            (click)="closeMenu()"
          >
            <span class="material-symbols-outlined text-base">dashboard</span>
            My Wikis
          </a>
          <a
            routerLink="/atlases"
            role="menuitem"
            class="flex w-full items-center gap-3 px-4 py-2.5 text-sm font-semibold text-[var(--muted)] transition-colors duration-150 hover:bg-[var(--soft-fill)] hover:text-[var(--text)]"
            (click)="closeMenu()"
          >
            <span class="material-symbols-outlined text-base">settings</span>
            Settings
          </a>
          @if (isAdmin()) {
            <a
              routerLink="/admin/users"
              role="menuitem"
              class="flex w-full items-center gap-3 px-4 py-2.5 text-sm font-semibold text-[var(--muted)] transition-colors duration-150 hover:bg-[var(--soft-fill)] hover:text-[var(--text)]"
              (click)="closeMenu()"
            >
              <span class="material-symbols-outlined text-base">group</span>
              Admin users
            </a>
          }
          <button
            type="button"
            role="menuitem"
            class="danger-action flex w-full items-center gap-3 px-4 py-2.5 text-sm"
            [disabled]="signingOut()"
            (click)="signOut()"
          >
            <span class="material-symbols-outlined text-base">logout</span>
            {{ signingOut() ? 'Signing out...' : 'Sign out' }}
          </button>
        </div>
      </div>
    }
  </div>
} @else {
  <a routerLink="/sign-in" [queryParams]="signInQueryParams()" [class]="signInClass()">
    {{ signInLabel() }}
  </a>
}
